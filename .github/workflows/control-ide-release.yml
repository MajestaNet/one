# Control IDE desktop installers on control-ide-v* tags (not product images).
# See docs/control-ide-build.md. Signing is frozen (ADR-030).
name: Control IDE Release

on:
  push:
    tags:
      - "control-ide-v*"

permissions:
  contents: write

concurrency:
  group: control-ide-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.0"
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks detect --verbose --redact --exit-code 1

  package:
    name: Package ${{ matrix.os }}
    needs: gitleaks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dist: dist:linux
          - os: windows-latest
            dist: dist:win
          - os: macos-latest
            dist: dist:mac
    defaults:
      run:
        working-directory: tools/control-ide
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - name: Install
        run: npm ci
      - name: Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools
      - name: Dist
        run: npm run ${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Assert IDE artifacts
        working-directory: .
        shell: bash
        run: bash ./scripts/assert-ide-artifacts.sh
      - name: Upload staging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: control-ide-${{ matrix.os }}
          path: |
            tools/control-ide/release/*.AppImage
            tools/control-ide/release/*.dmg
            tools/control-ide/release/*.zip
            tools/control-ide/release/*.exe
            tools/control-ide/release/*.blockmap
          if-no-files-found: error
          retention-days: 3

  publish:
    name: GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download staging artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**
